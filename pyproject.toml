[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "numcodecs-eb-quantize"
version = "0.1.0"
description = "Meta codec for linear quantisation with an absolute error bound, encoding the quantisation indices with an inner codec for the `numcodecs` buffer compression API"
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.10"
dependencies = [
    "leb128~=1.0.8",
    "numcodecs>=0.13.0,<0.17",
    "numcodecs-combinators~=0.2.13",
    "numpy~=2.0",
    "typing-extensions~=4.6",
]

[dependency-groups]
dev = ["mypy~=1.14", "pytest~=8.3"]

[project.entry-points."numcodecs.codecs"]
"eb_quantize" = "numcodecs_eb_quantize:ErrorBoundedQuantizeCodec"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"numcodecs_eb_quantize" = ["py.typed"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
xfail_strict = true

[[tool.mypy.overrides]]
module = ["leb128.*", "numcodecs.*", "numcodecs_combinators.*"]
follow_untyped_imports = true
